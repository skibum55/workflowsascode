name: Android Emulator Omnissa Enrollment

on:
  workflow_dispatch: # Allows manual trigger, or change to 'push' if needed

jobs:
  enroll-device:
    # x86_64 Emulators require hardware acceleration (KVM). 
    # Ubuntu-latest runners support KVM out of the box with proper configuration.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java/JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Enable KVM group permissions on the Ubuntu host to speed up emulator execution
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Download or construct the credentials.bin using GitHub Secrets
      # Make sure to generate this staging package from your Omnissa UEM Console
      - name: Prepare Omnissa Enrollment Files
        env:
          OMNISSA_CREDENTIALS_BASE64: ${{ secrets.OMNISSA_CREDENTIALS_BASE64 }}
          OMNISSA_URL : ${{secrets.OMNISSA_URL}}
        run: |
          # Download your Hub APK (replace with your preferred download link or local file)
          curl -L -o omnissa-hub.apk "https://getwsone.com/mobileenrollment/airwatchagent.apk"
          
          # Rebuild your binary credentials file securely from repository secrets
          echo "$OMNISSA_CREDENTIALS_BASE64" | base64 --decode > credentials.bin

      # Launch the emulator and execute setup
      - name: Run Emulator and install Airwatch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33              # Android 13 (Adjust based on requirements)
          target: google_apis_playstore        # Essential for background service stability
          arch: x86_64               # x86_64 runs natively fast on Ubuntu KVM
          disable-animations: true   # Keeps UI cycles fast during automation
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -dns-server 8.8.8.8 -netfast -no-metrics
          
          script: |
            echo "=== Waiting for boot to completely stabilize ==="
            adb wait-for-device
            
            echo "=== Installing Omnissa Intelligent Hub APK ==="
            adb install omnissa-hub.apk
            # adb shell setprop ro.boot.verifiedbootstate verified
            adb shell dpm set-device-owner com.airwatch.androidagent/com.airwatch.agent.DeviceAdministratorReceiver
            # adb shell dpm set-active-admin com.airwatch.androidagent/com.airwatch.agent.DeviceAdministratorReceiver
            
            # echo "=== Pre-fill staging info"
            # adb shell am start -n com.airwatch.androidagent/com.airwatch.agent.ui.activity.SplashActivity --es "serverurl" "${{ secrets.UEM_URL }}" --es "groupid" "${{ secrets.UEM_GROUPID }}" --es "username" "${{ secrets.UEM_USER }}" --es "password" "${{ secrets.UEM_PASSWORD }}" --ez "auto_enroll" true --ez "skip_welcome" true

            echo "=== 1. Starting Workspace ONE Intelligent Hub ==="
            # Single continuous string to completely avoid shell parser line-break bugs
            adb shell am start -n com.airwatch.androidagent/com.airwatch.agent.ui.activity.SplashActivity --es "serverurl" "${{ secrets.UEM_URL }}" --es "groupid" "${{ secrets.UEM_GROUPID }}" --es "username" "${{ secrets.UEM_USER }}" --es "password" "${{ secrets.UEM_PASSWORD }}" --ez "auto_enroll" true --ez "skip_welcome" true 
  
            echo "=== 2. Starting Enrollment Verification Loop ==="
            # TIMEOUT_SECONDS=300 && SLEEP_INTERVAL=10 && ELAPSED=0 && SUCCESS=false && EXPECTED_ADMIN="com.airwatch.androidagent/com.airwatch.agent.DeviceAdministratorReceiver" && echo "Waiting for device..." && while [ "$ELAPSED" -lt "$TIMEOUT_SECONDS" ]; do CURRENT_ADMINS=$(adb shell dpm list-owners); case "$CURRENT_ADMINS" in *"$EXPECTED_ADMIN"*) echo "=== [SUCCESS] Enrolled! ==="; SUCCESS=true; break ;; esac; echo "Pending... (${ELAPSED}s elapsed). Retrying in ${SLEEP_INTERVAL}s..."; sleep "$SLEEP_INTERVAL"; ELAPSED=$((ELAPSED + SLEEP_INTERVAL)); done && if [ "$SUCCESS" = "false" ]; then echo "=== [ERROR] Enrollment timed out after ${TIMEOUT_SECONDS} seconds! ==="; adb shell dpm list-owners; adb logcat -d | grep -i "AirWatch\|Enrollment" | tail -n 20; exit 1; fi
            adb logcat -c; t=0; max=60; success=false; while [ $t -lt $max ]; do if adb logcat -d | grep -i "Hub enrollment status:" | tail -n 1 | grep -q "true"; then echo "✅ Hub enrolled!"; success=true; break; fi; sleep 2; t=$((t+2)); done; if [ "$success" = false ]; then echo "❌ Timeout"; exit 1; fi

            # echo "=== Sideloading credentials"
            # adb push credentials.bin /sdcard/credentials.bin
            
            # echo "=== Launching UI Component Silently inside Virtual Memory ==="
            # # -e hideui true forces the Omnissa Hub app to process in headless mode
            # adb shell am start -n com.airwatch.agent.ui.activity.SplashActivity -e hideui true
            # sleep 30
            
            # echo "=== Injecting Credentials File ==="
            # adb shell am broadcast -a com.airwatch.agent.action.IMPORT_CREDENTIAL_XML -e file /sdcard/credentials.bin --user 0
            
            echo "=== Verifying Enrollment status ==="
            # Allow background tasks 15 seconds to run the process
            sleep 15
            
            # Print the background process status to confirm it didn't crash
            adb shell pm list packages | grep airwatch
