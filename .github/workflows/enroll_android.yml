name: Android Emulator Omnissa Enrollment

on:
  workflow_dispatch: # Allows manual trigger, or change to 'push' if needed

jobs:
  enroll-device:
    # x86_64 Emulators require hardware acceleration (KVM). 
    # Ubuntu-latest runners support KVM out of the box with proper configuration.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java/JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Enable KVM group permissions on the Ubuntu host to speed up emulator execution
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Download or construct the credentials.bin using GitHub Secrets
      # Make sure to generate this staging package from your Omnissa UEM Console
      - name: Prepare Omnissa Enrollment Files
        env:
          OMNISSA_CREDENTIALS_BASE64: ${{ secrets.OMNISSA_CREDENTIALS_BASE64 }}
        run: |
          # Download your Hub APK (replace with your preferred download link or local file)
          curl -L -o omnissa-hub.apk "https://getwsone.com/mobileenrollment/airwatchagent.apk"
          
          # Rebuild your binary credentials file securely from repository secrets
          echo "$OMNISSA_CREDENTIALS_BASE64" | base64 --decode > credentials.bin

      # Launch the emulator and execute setup
      - name: Run Emulator and Enroll Device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33              # Android 13 (Adjust based on requirements)
          target: google_apis        # Essential for background service stability
          arch: x86_64               # x86_64 runs natively fast on Ubuntu KVM
          disable-animations: true   # Keeps UI cycles fast during automation
          
          script: |
            echo "=== Waiting for boot to completely stabilize ==="
            adb wait-for-device
            
            echo "=== Installing Omnissa Intelligent Hub APK ==="
            adb install omnissa-hub.apk
            
            echo "=== Pushing Sideload Credentials file ==="
            # Omnissa Hub scans the root directory of the sdcard for credentials.bin on launch
            adb push credentials.bin /sdcard/credentials.bin
            
            echo "=== Starting Enrollment Service ==="
            # Force launch the background airwatch service to ingest credentials and self-enroll
            adb shell am start -a com.airwatch.START_AIRWATCH_SERVICE
            
            echo "=== Verifying Enrollment status ==="
            # Allow background tasks 15 seconds to run the process
            sleep 15
            
            # Print the background process status to confirm it didn't crash
            adb shell pm list packages | grep airwatch
