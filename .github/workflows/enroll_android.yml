name: Android Emulator Omnissa Enrollment

on:
  workflow_dispatch: # Allows manual trigger, or change to 'push' if needed

jobs:
  enroll-device:
    # x86_64 Emulators require hardware acceleration (KVM). 
    # Ubuntu-latest runners support KVM out of the box with proper configuration.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java/JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Enable KVM group permissions on the Ubuntu host to speed up emulator execution
      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Download or construct the credentials.bin using GitHub Secrets
      # Make sure to generate this staging package from your Omnissa UEM Console
      - name: Prepare Omnissa Enrollment Files
        env:
          OMNISSA_CREDENTIALS_BASE64: ${{ secrets.OMNISSA_CREDENTIALS_BASE64 }}
          OMNISSA_URL : ${{secrets.OMNISSA_URL}}
        run: |
          # Download your Hub APK (replace with your preferred download link or local file)
          curl -L -o omnissa-hub.apk "https://getwsone.com/mobileenrollment/airwatchagent.apk"
          
          # Rebuild your binary credentials file securely from repository secrets
          echo "$OMNISSA_CREDENTIALS_BASE64" | base64 --decode > credentials.bin

      # Launch the emulator and execute setup
      - name: Run Emulator and Enroll Device
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33              # Android 13 (Adjust based on requirements)
          target: google_apis        # Essential for background service stability
          arch: x86_64               # x86_64 runs natively fast on Ubuntu KVM
          disable-animations: true   # Keeps UI cycles fast during automation
          
          script: |
            echo "=== Waiting for boot to completely stabilize ==="
            adb wait-for-device
            
            echo "=== Installing Omnissa Intelligent Hub APK ==="
            adb install omnissa-hub.apk

            echo "=== Pre-fill staging info"
            adb shell am start -n com.airwatch.agent.ui.activity.WelcomeActivity \
              --es "serverurl" "${{secrets.UEM_URL}}" \
              --es "groupid" "${{secrets.UEM_GROUPID}}" \
              --es "username" "${{secrets.UEM_USER}}" \
              --es "password" "${{secrets.UEM_PASSWORD}}" \
              --ez "auto_enroll" true \
              --ez "skip_welcome" true

            echo "=== Verification Check ==="
            sleep 60
            # adb shell dumpsys activity top | grep WelcomeActivity || echo "Activity successfully advanced or hidden."
            # Define configuration variables
            TIMEOUT_SECONDS=60
            SLEEP_INTERVAL=5
            ELAPSED=0
            SUCCESS=false
            
            # Expected Workspace ONE admin component string
            EXPECTED_ADMIN="com.airwatch.agent.DeviceAdministratorReceiver"
            
            echo "=== Starting Workspace ONE enrollment verification loop ==="
            echo "Waiting for device to report active administrator status (Timeout: ${TIMEOUT_SECONDS}s)..."
            
            while [ $ELAPSED -lt $TIMEOUT_SECONDS ]; do
                # Query ADB for active admins and check for the WS1 receiver string
                CURRENT_ADMINS=$(adb shell dpm list-active-admins)
                
                if echo "$CURRENT_ADMINS" | grep -q "$EXPECTED_ADMIN"; then
                    echo "=== [SUCCESS] Device successfully enrolled in Workspace ONE! ==="
                    SUCCESS=true
                    break
                fi
            
                echo "Enrollment pending... (${ELAPSED}s elapsed). Retrying in ${SLEEP_INTERVAL}s..."
                sleep $SLEEP_INTERVAL
                ELAPSED=$((ELAPSED + SLEEP_INTERVAL))
            done
            
            if [ "$SUCCESS" = false ]; then
                echo "=== [ERROR] Enrollment timed out after ${TIMEOUT_SECONDS} seconds! ==="
                echo "Dumping active administrators for debugging:"
                adb shell dpm list-active-admins
                
                echo "Dumping recent Hub app system logs:"
                adb logcat -d | grep -i -E "AirWatch|Enrollment" | tail -n 20
                
                exit 1
            fi
            
            # echo "=== Sideloading credentials"
            # adb push credentials.bin /sdcard/credentials.bin
            
            # echo "=== Launching UI Component Silently inside Virtual Memory ==="
            # # -e hideui true forces the Omnissa Hub app to process in headless mode
            # adb shell am start -n com.airwatch.agent.ui.activity.SplashActivity -e hideui true
            # sleep 30
            
            # echo "=== Injecting Credentials File ==="
            # adb shell am broadcast -a com.airwatch.agent.action.IMPORT_CREDENTIAL_XML -e file /sdcard/credentials.bin --user 0
            
            echo "=== Verifying Enrollment status ==="
            # Allow background tasks 15 seconds to run the process
            sleep 15
            
            # Print the background process status to confirm it didn't crash
            adb shell pm list packages | grep airwatch
