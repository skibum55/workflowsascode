name: Phase 3 - Test on Develop
on:
  push:
    branches: [develop]

jobs:
  test-nonprod:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    # Phase 3 Step 1: Trigger on commit to develop
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 18
        
    - name: Install dependencies
      run: npm ci
      
    # Phase 3 Steps 9-13: Full test suite with rollback protection
    - name: Run automated tests
      env:
        # This should point to your "Master" or "Non-Prod" instance
        N8N_URL: ${{ secrets.N8N_URL }}
        N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      run: npm run test
      
    # Phase 4 Step 2: Block merge if tests fail
    - name: Update PR status
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.repos.createCommitStatus({
            owner: context.repo.owner,
            repo: context.repo.repo,
            sha: context.sha,
            state: 'failure',
            context: 'n8n Non-Prod Tests',
            description: 'Automated tests failed - review required',
            target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
          })